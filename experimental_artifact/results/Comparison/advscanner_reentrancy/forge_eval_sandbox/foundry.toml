[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

# Increase memory limit for complex exploit tests
memory_limit = 134217728

# Solidity compiler settings
solc_version = "0.8.20"
evm_version = "shanghai"

# Allow using FFI (foreign function interface) if needed
ffi = false

# Gas settings
gas_limit = 9999999999
gas_price = 0

# Compiler optimization
optimizer = true
optimizer_runs = 200
